[package]
name = "mimori"
version = "2.3.0"
edition = "2021"
authors = ["mimori team"]
description = "High-performance AST code-intelligence and symbol-graph CLI"
license = "MIT"
repository = "https://github.com/fusuyfusuy/mimori"
# Internal agent-harness config and the defect audit are not part of the
# published crate: 101 of 164 packaged files were .agents/skills/**.
exclude = [".agents/", "reports/"]

[[bin]]
name = "mimori"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tree-sitter = "0.24"
tree-sitter-rust = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-go = "0.23"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "2.0"
ignore = "0.4"
rayon = "1.10"
rusqlite = { version = "0.32", features = ["bundled"] }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.16"
